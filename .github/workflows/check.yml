name: 프로젝트 검사

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 타입 · 검색 · 빌드
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 소스 가져오기
        uses: actions/checkout@v7
      - name: Node.js 준비
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: 의존성 설치
        run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 검색 및 화면 렌더링 검사
        run: npm test
      - name: 배포용 빌드
        run: npm run build
