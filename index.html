<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // 비밀번호 잠금 (시연용): 페이지를 새로 불러올 때마다 다시 묻는다
      // 비밀번호 화면에서 넣은 표시를 한 번만 쓰고 지우므로, 새로고침·새 탭·다시 방문은 모두 잠금 화면으로 간다
      (function () {
        var h = location.hostname;
        if (h === "localhost" || h === "127.0.0.1" || h === "[::1]") return;
        var ok = false;
        try {
          ok = sessionStorage.getItem("da_unlocked") === "1";
          sessionStorage.removeItem("da_unlocked");
        } catch (e) {}
        if (ok) return;
        // 새로고침이면 잠금을 풀고 첫 화면으로, 링크로 들어온 거면 그 화면으로 돌아간다
        var nav = (performance.getEntriesByType && performance.getEntriesByType("navigation")[0]) || {};
        var back = nav.type === "reload" ? "/" : location.pathname + location.search + location.hash;
        location.replace("/__logout?next=" + encodeURIComponent(back));
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <title>디자인 자산 아카이브</title>
    <meta
      name="description"
      content="회사에서 제작한 상세페이지, 배너, 카드뉴스 등 디자인 작업물을 검색하고 재활용하기 위한 내부 디자인 아카이브 서비스입니다."
    />
    <meta property="og:title" content="디자인 자산 아카이브" />
    <meta
      property="og:description"
      content="회사에서 제작한 상세페이지, 배너, 카드뉴스 등 디자인 작업물을 검색하고 재활용하기 위한 내부 디자인 아카이브 서비스입니다."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body
    class="bg-[#F7F3EF] text-[#191919] antialiased selection:bg-[#246BFD]/15 selection:text-[#191919]"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
